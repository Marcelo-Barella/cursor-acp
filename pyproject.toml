[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cursor-acp"
version = "0.1.0"
description = "Python library for Cursor Agent Client Protocol (ACP) integration."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "PLACEHOLDER_AUTHOR_NAME", email = "PLACEHOLDER_AUTHOR_EMAIL@example.invalid" },
]
maintainers = [
    { name = "PLACEHOLDER_MAINTAINER_NAME", email = "PLACEHOLDER_MAINTAINER_EMAIL@example.invalid" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
keywords = ["cursor", "acp", "agent", "library"]

[project.urls]
Homepage = "https://github.com/Marcelo-Barella/cursor-acp"
Repository = "https://github.com/Marcelo-Barella/cursor-acp"
Documentation = "https://github.com/Marcelo-Barella/cursor-acp#readme"
Changelog = "https://github.com/Marcelo-Barella/cursor-acp/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cursor_acp = ["py.typed"]
